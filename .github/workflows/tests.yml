name: Tests

on:
  push:
    branches:
      - feature/tiny-transformer
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - feature/tiny-transformer
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch
      - name: Run test suite
        run: python -m pytest -q
      - name: Check training CLI
        run: python -m src.train --help
