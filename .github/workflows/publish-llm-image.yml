name: Build and publish Sinhala-English LLM Docker image

on:
  schedule:
    # Run after the hourly training workflow has time to refresh the checkpoint.
    - cron: "45 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-llm-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-llm-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the latest trained model branch
        uses: actions/checkout@v4
        with:
          ref: feature/tokenizer-cleaning-cpu-benchmark

      - name: Verify checkpoint and tokenizer are present
        run: |
          test -s checkpoints/hourly-bpe-model.pt
          test -s artifacts/sinhala_english_bpe.model

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nipun0bugs/sinhala-english-llm-from-scratch:latest
            ghcr.io/nipun0bugs/sinhala-english-llm-from-scratch:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/NIPUN0BUGS/sinhala-english-llm-from-scratch
            org.opencontainers.image.description=CPU-only Sinhala-English Tiny LLM API
