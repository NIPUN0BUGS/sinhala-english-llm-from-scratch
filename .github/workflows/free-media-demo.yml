name: Free image and video demo pipeline

on:
  push:
    branches:
      - feature/tokenizer-cleaning-cpu-benchmark
    paths:
      - "scripts/free_media_pipeline.py"
      - ".github/workflows/free-media-demo.yml"
      - "docs/free-media-demo-ci.md"
  schedule:
    # Daily at 08:00 Sri Lanka time (02:30 UTC).
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      image_prompt:
        description: "Prompt for the demo image"
        required: false
        default: "friendly colorful 2D cartoon scene of a curious little robot exploring a green Sri Lankan garden, clean composition, no text"
      commons_query:
        description: "Wikimedia Commons video discovery query"
        required: false
        default: "animation cartoon"

permissions:
  contents: read

concurrency:
  group: free-media-demo-pipeline
  cancel-in-progress: false

jobs:
  generate-discover-render:
    if: github.repository == 'NIPUN0BUGS/sinhala-english-llm-from-scratch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_PROMPT: ${{ github.event.inputs.image_prompt || 'friendly colorful 2D cartoon scene of a curious little robot exploring a green Sri Lankan garden, clean composition, no text' }}
      COMMONS_QUERY: ${{ github.event.inputs.commons_query || 'animation cartoon' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate image, discover Commons candidates, and render demo MP4
        run: python scripts/free_media_pipeline.py
      - name: Upload image, MP4, attribution candidates, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zee-free-media-demo-${{ github.run_number }}
          path: media-output/
          if-no-files-found: error
          retention-days: 14
