name: Secure LLM CI

on:
  push:
    branches: [main, "security/**", "feature/**", "bugfix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-llm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.9.0
          python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify dataset provenance and hashes
        run: python -m src.provenance --dataset data/raw/train.txt --manifest data/provenance.json
      - name: Check for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload safe test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-ci-report-${{ github.run_id }}
          path: data/provenance.json
          if-no-files-found: ignore
          retention-days: 7
