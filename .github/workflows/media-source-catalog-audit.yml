name: Media source catalogue audit

on:
  push:
    branches:
      - feature/tokenizer-cleaning-cpu-benchmark
    paths:
      - "data/media/source_catalog.json"
      - "docs/media-model-pipelines.md"
      - ".github/workflows/media-source-catalog-audit.yml"
  schedule:
    # Weekly metadata/policy sanity check; this does not download media.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/tokenizer-cleaning-cpu-benchmark

      - name: Validate JSON and required policy fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/media/source_catalog.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("schema_version") == 1
          policy = data.get("policy", {})
          assert policy.get("require_asset_level_license") is True
          assert policy.get("require_commercial_permission_for_monetized_zee") is True
          assert policy.get("commit_media_files_to_git") is False
          assert policy.get("automatic_model_promotion") is False
          sources = data.get("sources")
          assert isinstance(sources, list) and sources, "No media sources configured"
          seen = set()
          for source in sources:
              for key in ("id", "modality", "url", "license_policy", "allowed_for_automatic_download"):
                  assert source.get(key), f"Missing {key} in source record: {source}"
              assert source["id"] not in seen, f"Duplicate source id: {source['id']}"
              seen.add(source["id"])
              assert source["url"].startswith("https://"), source["url"]
              assert source["allowed_for_automatic_download"] is False, (
                  f"Source {source['id']} must remain manual until item-level licensing is implemented"
              )
          print(f"Validated {len(sources)} source records; no media downloaded.")
          PY
