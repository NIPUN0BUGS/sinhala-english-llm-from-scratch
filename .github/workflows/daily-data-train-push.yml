name: Daily data growth and Tiny LLM training

on:
  schedule:
    # 07:30 Sri Lanka time (02:00 UTC), daily.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      pages_per_language:
        description: "New Wikipedia pages to request per language (1-5)"
        required: false
        default: "5"
      max_steps:
        description: "Maximum optimizer steps for this run"
        required: false
        default: "200"

permissions:
  contents: write

concurrency:
  group: daily-llm-data-training
  cancel-in-progress: false

jobs:
  collect-train-test-push:
    if: github.repository == 'NIPUN0BUGS/sinhala-english-llm-from-scratch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAGES_PER_LANGUAGE: ${{ github.event.inputs.pages_per_language || '5' }}
      MAX_STEPS: ${{ github.event.inputs.max_steps || '200' }}
      CHECKPOINT: checkpoints/hourly-bpe-model.pt
      TOKENIZER: artifacts/sinhala_english_bpe.model

    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4
        with:
          ref: feature/tokenizer-cleaning-cpu-benchmark
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentencepiece

      - name: Collect new Sinhala and English Wikipedia extracts
        run: |
          python -m src.update_wikipedia_corpus --pages-per-language "$PAGES_PER_LANGUAGE"

      - name: Prepare clean train, validation, and test splits
        run: |
          python -m src.prepare_corpus --input data/raw/hourly_corpus.txt --output-dir data/processed --seed 42

      - name: Run tests before training
        run: python -m unittest discover -s tests -v

      - name: Verify checkpoint and tokenizer
        shell: bash
        run: |
          test -s "$CHECKPOINT"
          test -s "$TOKENIZER"
          python - <<'PY'
          import torch
          checkpoint = torch.load("checkpoints/hourly-bpe-model.pt", map_location="cpu", weights_only=True)
          assert checkpoint.get("tokenizer_type") == "bpe", "Expected a BPE checkpoint"
          assert isinstance(checkpoint.get("model_config"), dict), "Missing model_config"
          assert isinstance(checkpoint.get("model_state_dict"), dict), "Missing model weights"
          print("Checkpoint metadata is valid.")
          PY

      - name: Train from the latest checkpoint
        run: |
          python -m src.train \
            --train-corpus data/processed/train.txt \
            --validation-corpus data/processed/validation.txt \
            --test-corpus data/processed/test.txt \
            --checkpoint "$CHECKPOINT" \
            --tokenizer bpe \
            --tokenizer-model "$TOKENIZER" \
            --epochs 1 \
            --max-steps "$MAX_STEPS" \
            --batch-size 8 \
            --context-length 64 \
            --resume "$CHECKPOINT" \
            --reset-best-validation

      - name: Run tests after training
        run: python -m unittest discover -s tests -v

      - name: Commit new source attribution and improved checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not commit raw corpora or processed splits; retain attribution metadata
          # and the model artifact that ZEE consumes.
          if [ -f data/raw/wikipedia_manifest.jsonl ]; then git add data/raw/wikipedia_manifest.jsonl; fi
          git add -f checkpoints/hourly-bpe-model.pt
          if git diff --cached --quiet; then
            echo "No manifest or checkpoint changes to push."
            exit 0
          fi
          git commit -m "chore: refresh Wikipedia corpus and Tiny LLM checkpoint [skip ci]"
          git push origin HEAD:feature/tokenizer-cleaning-cpu-benchmark
