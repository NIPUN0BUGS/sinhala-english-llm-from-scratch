name: Scheduled feature branch tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/feature-branch-tests-cron.yml"
      - "src/**"
      - "tests/**"
      - "Dockerfile"
  schedule:
    # Run every 6 hours (UTC); GitHub scheduled workflows run from the default branch.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-feature-branch-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tokenizer and CPU benchmark branch
        uses: actions/checkout@v4
        with:
          ref: feature/tokenizer-cleaning-cpu-benchmark

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
          python - <<'PY'
          import numpy, pytest, sentencepiece, torch
          print(f"Python dependencies ready: torch={torch.__version__}, numpy={numpy.__version__}, sentencepiece={sentencepiece.__version__}, pytest={pytest.__version__}")
          assert not torch.cuda.is_available(), "CI should use the CPU-only PyTorch build"
          PY

      - name: Run project tests
        run: python -m pytest -q tests

      - name: Validate training CLI
        run: python -m src.train --help


      - name: Build CPU Docker image
        run: docker build --tag tiny-sinhala-english-llm:ci .

      - name: Start container and verify API health
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name tiny-llm-api-ci -e TINY_LLM_API_KEY=ci-test-key -p 8766:8766 tiny-sinhala-english-llm:ci
          cleanup() { docker stop tiny-llm-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/health; then
              echo
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "Tiny LLM API did not become healthy. Container logs:"
            docker logs tiny-llm-api-ci
            exit 1
          fi
          curl --fail --silent --show-error -X POST http://127.0.0.1:8766/generate -H "Content-Type: application/json" -H "X-API-Key: ci-test-key" -d '{"prompt":"Hi","max_new_tokens":1,"temperature":0.8,"top_k":1}'
          echo
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" -X POST http://127.0.0.1:8766/generate -H "Content-Type: application/json" -d '{"prompt":"Hi","max_new_tokens":1}')
          if [ "$status" != "401" ]; then
            echo "Expected unauthenticated generation to return HTTP 401; got $status"
            exit 1
          fi
          echo "Unauthenticated generation correctly rejected."

      - name: Validate BPE tokenizer artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.tokenizer import SentencePieceBPETokenizer

          model = Path("artifacts/sinhala_english_bpe.model")
          if not model.is_file():
              raise SystemExit(f"Missing tokenizer model: {model}")
          tokenizer = SentencePieceBPETokenizer(str(model))
          for text in ("ආයුබෝවන් ශ්‍රී ලංකාව", "Hello Sri Lanka"):
              ids = tokenizer.encode(text)
              if not ids:
                  raise SystemExit(f"Tokenizer returned no tokens for: {text!r}")
              print(f"OK: {text!r} -> {len(ids)} tokens")
          PY
